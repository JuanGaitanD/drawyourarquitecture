<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DYA · Draw your Architecture</title>
    <meta
      name="description"
      content="Pizarra libre tipo Excalidraw y diagramas de arquitectura tipo Miro, en un solo lugar."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#136a55" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <!-- Favicon: SVG (claro/oscuro dentro del propio SVG), PNG de 32 px de respaldo (Safari) y apple-touch-icon opaco -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph genérico (las vistas públicas añaden noindex al montarse) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DYA" />
    <meta property="og:title" content="DYA · Draw your Architecture" />
    <meta
      property="og:description"
      content="Pizarra libre tipo Excalidraw y diagramas de arquitectura tipo Miro, en un solo lugar."
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://dya.juandgaitan.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DYA (Draw your Architecture): notas y diagramas de arquitectura" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Aplica el tema guardado antes de pintar para evitar el parpadeo claro → oscuro -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme');
          var dark =
            p === 'dark' ||
            ((p === null || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
